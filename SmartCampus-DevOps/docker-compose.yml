services:
  blue:
    build: .
    container_name: campus-blue
    environment:
      AppInfo__Version: "1.0"
      AppInfo__EnvironmentName: "BLUE"
      AppInfo__EnhancedUi: "false"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8081:8080"

  green:
    build: .
    container_name: campus-green
    environment:
      AppInfo__Version: "2.0"
      AppInfo__EnvironmentName: "GREEN"
      AppInfo__EnhancedUi: "true"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8082:8080"

  production:
    image: nginx:alpine
    container_name: campus-production
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - blue
      - green
